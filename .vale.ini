# Vale's word-level checks (scripts/docs-lint/README.md, "Vale"). Errors fail CI; warnings show on the files a pull
# request changes; suggestions show only in an editor with a Vale plugin.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = HellForge
# History is for code comments: a changelog or a decision record tells history on purpose.
HellForge.History = NO

# Generated from the SDK's sources (HellForge.Cli sdk-headers): fix its text there.
[docs/sdk-reference.md]
BasedOnStyles =

# Code comments: the same checks, but not the paragraph rule (a comment block has R16 of scripts/lint).
[*.{cs,c,h,cpp}]
BasedOnStyles = HellForge
HellForge.ParagraphLength = NO
