# The checks every pull request into dev or main must pass (CONTRIBUTING.md, "Branches and pull requests"): the
# structure lint (scripts/lint/README.md), the docs lint (scripts/docs-lint/README.md), the engine version check and
# the nightly build's scripts. The builds run on pull requests into main and linux-native, and on every push to dev,
# but not on pull requests into dev: the Windows build (warnings are errors) and the checks that need no game, as
# scripts/Test.ps1 runs them, the Linux launcher, CLI and tests, and the native build. The engine and the in-game
# editor build and test on a maintainer's PC: they need the game's files, the Steamworks SDK and a GPU.
name: CI

on:
  pull_request:
    branches: [dev, main, linux-native]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Structure lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'   # the oldest the lint supports (scripts/lint/README.md)
      - name: The lint's own tests
        run: python -m unittest discover -s scripts/lint/tests -v
      # fails on any violation that scripts/lint/lint-baseline.json does not have, and on a known one that grew: with
      # --warnings-as-errors, a new R10, R11 or R15 one fails as an error rule's does (scripts/lint/README.md, "The baseline")
      - name: scripts/lint/lint.py check --warnings-as-errors
        run: python scripts/lint/lint.py check --warnings-as-errors

  # Docs and code comments (scripts/docs-lint/README.md): page types and prose sizes against the baseline, Markdown
  # structure, links, and Vale's word checks. The tool versions are pinned; update them here and in the README.
  docs:
    name: Docs lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VALE_VERSION: 3.24.0
      VALE_SHA256: 867534ddb678abca7f214bc4706ead0922bd5252ffe8035fc227013f66c8b214
      LYCHEE_VERSION: 0.24.2
      LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a
      MARKDOWNLINT_CLI2_VERSION: 0.23.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the pull request's base, for the files it changes
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: The docs lint's own tests
        run: python -m unittest discover -s scripts/docs-lint/tests -v
      # D1 and D2 fail; the size rules (D3-D5) are annotations until the docs are split (scripts/docs-lint/README.md)
      - name: scripts/docs-lint/docs_lint.py check
        run: python scripts/docs-lint/docs_lint.py check
      - name: markdownlint
        if: ${{ !cancelled() }}
        run: npx --yes "markdownlint-cli2@$MARKDOWNLINT_CLI2_VERSION" '**/*.md'
      - name: Install Vale and lychee
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          vale=vale_${VALE_VERSION}_Linux_64-bit.tar.gz
          curl -fsSLo "$vale" "https://github.com/errata-ai/vale/releases/download/v$VALE_VERSION/$vale"
          echo "$VALE_SHA256  $vale" | sha256sum -c -
          tar -xzf "$vale" -C bin vale
          lychee=lychee-x86_64-unknown-linux-gnu
          curl -fsSLo "$lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v$LYCHEE_VERSION/$lychee.tar.gz"
          echo "$LYCHEE_SHA256  $lychee.tar.gz" | sha256sum -c -
          tar -xzf "$lychee.tar.gz" -C bin --strip-components=1 "$lychee/lychee"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # relative links and #anchors only: no network, so it never fails for a site that is down
      - name: Links (lychee, offline)
        if: ${{ !cancelled() }}
        run: lychee --offline --include-fragments --no-progress --root-dir "$GITHUB_WORKSPACE" $(git ls-files '*.md')
      # errors fail, in every file; warnings show on the files the pull request changes and do not fail
      - name: Vale
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          kinds=('*.md' '*.cs' '*.c' '*.h' '*.cpp')
          vale --minAlertLevel=error --output=.vale/github-annotations.tmpl $(git ls-files "${kinds[@]}")
          if [ -n "$BASE_REF" ]; then
            changed=$(git diff --name-only --diff-filter=AM "origin/$BASE_REF...HEAD" -- "${kinds[@]}")
            if [ -n "$changed" ]; then
              vale --minAlertLevel=warning --output=.vale/github-annotations.tmpl --no-exit $changed
            fi
          fi

  # Whether the engine changed since the commit that set EngineVersion (scripts/engine-version/engine_version.py,
  # CONTRIBUTING.md "The engine's version"): a warning on an ordinary pull request, a failure on a version-bump pull
  # request or a release (into main) whose engine changed without a bump.
  engine-version:
    name: Engine version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history: the commit that set EngineVersion, and the pull request's base
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: The check's own tests
        run: python -m unittest discover -s scripts/engine-version/tests -v
      - name: scripts/engine-version/engine_version.py
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            release=""; if [ "$BASE_REF" = "main" ]; then release="--release"; fi
            python scripts/engine-version/engine_version.py --base "origin/$BASE_REF" $release
          else
            python scripts/engine-version/engine_version.py
          fi

  # The nightly build's version and release notes (scripts/nightly/nightly.py, .github/workflows/nightly.yml), which no
  # pull request runs otherwise.
  nightly-scripts:
    name: Nightly scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: scripts/nightly's tests
        run: python -m unittest discover -s scripts/nightly/tests -v

  test:
    name: Build and test
    # not on pull requests into dev: dev builds after each merge (the push run)
    if: github.event_name != 'pull_request' || github.base_ref != 'dev'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-tools   # the .NET SDK, as the native job and the nightly build have it
      - name: scripts/Test.ps1 (build, HellForge.Tests, HellForge.LocalBackend.Tests, the CLI's path checks)
        shell: pwsh
        run: |
          # the tests' temporary files inside the workspace, as on a developer's PC (artifacts/ is ignored)
          $env:TEMP = $env:TMP = (New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'artifacts/tmp')).FullName
          ./scripts/Test.ps1
          # Test.ps1 throws on any failure; its last checks expect the CLI to refuse (exit code 1), which the step's own
          # "exit $LASTEXITCODE" would otherwise report
          exit 0

  # The Linux launcher, CLI and synthetic tests, on the same .NET as the Windows job. They need no game, GPU or Windows.
  # libarchive-tools provides bsdtar, which the .7z test skips without.
  linux:
    name: Linux build and test
    # not on pull requests into dev: dev builds after each merge (the push run)
    if: github.event_name != 'pull_request' || github.base_ref != 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: bash -n linux/*.sh
        run: for f in linux/*.sh; do bash -n "$f"; done
      - name: Install libarchive-tools (bsdtar)
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
          bsdtar --version
      - name: Build the launcher, CLI and tests
        env:
          TMPDIR: ${{ github.workspace }}/artifacts/tmp
        run: |
          # the tests' temporary files inside the workspace, as on a developer's PC (artifacts/ is ignored)
          mkdir -p "$TMPDIR"
          dotnet build src/HellForge.Launcher -c Release
          dotnet build src/HellForge.Cli -c Release
          dotnet build tests/HellForge.Tests -c Release
      - name: HellForge.Tests
        env:
          TMPDIR: ${{ github.workspace }}/artifacts/tmp
        run: dotnet run --project tests/HellForge.Tests -c Release --no-build
      - name: HellForge.LocalBackend.Tests
        env:
          # Unix socket paths are limited to 108 characters; runner.temp is short (/home/runner/work/_temp).
          TMPDIR: ${{ runner.temp }}
        run: |
          dotnet build tests/HellForge.LocalBackend.Tests -c Release
          dotnet run --project tests/HellForge.LocalBackend.Tests -c Release --no-build

  # The native code: the mod loader and its tests, the PlayFab stand-ins, the steam_api64.dll stand-in and its census
  # build, the network gate, the broker's channel and local lobby, the WFP tool, the example code mods, the smokes, the
  # NativeAOT backend check, and the in-game editor with its Local Stats test. Zig, MinHook, the PlayFab SDK packages and
  # Dear ImGui are downloaded as on a developer's PC, each checked against its SHA-256 pin. Valve's steam_api64.dll and
  # Steamworks SDK cannot be: Valve publishes both only behind a Steamworks sign-in, and the repository commits neither. So
  # Build-Engine.ps1 runs with -NoSteamApi (a synthetic export table for the stand-in; no Steam bridge, broker build,
  # bridge test or package), and the editor without its overlay test (a real D3D12 swap chain on a desktop: no GPU here).
  native:
    name: Native build and test
    # not on pull requests into dev: dev builds after each merge (the push run)
    if: github.event_name != 'pull_request' || github.base_ref != 'dev'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # the .NET SDK, Zig's cache folders and the caches of the pinned downloads and Zig's compiled libraries, as the
      # nightly build has them (.github/actions/build-tools)
      - uses: ./.github/actions/build-tools
        with:
          native: 'true'
      - name: scripts/Build-Engine.ps1 -NoSteamApi (the engine's native builds, tests and smokes)
        shell: pwsh
        run: |
          $env:TEMP = $env:TMP = (New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'artifacts/tmp')).FullName
          ./scripts/Build-Engine.ps1 -NoSteamApi
          # it throws on any failure; the last exit code of a program it ran (some checks expect a refusal) must not decide
          exit 0
      - name: scripts/Build-Editor.ps1 -Test -SkipOverlayTest (the in-game editor and its Local Stats test)
        shell: pwsh
        run: |
          $env:TEMP = $env:TMP = (New-Item -ItemType Directory -Force (Join-Path $env:GITHUB_WORKSPACE 'artifacts/tmp')).FullName
          ./scripts/Build-Editor.ps1 -Test -SkipOverlayTest
          exit 0   # likewise
