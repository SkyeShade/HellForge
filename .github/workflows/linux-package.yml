name: Build Linux package

on:
  # Every merge into linux-native gets a test build: workflow_dispatch can only be started once this file is on main.
  push:
    branches: [linux-native]
  # So does every pull request into linux-native, to test a change in a real session before it merges. The Linux
  # session runner is a Windows NativeAOT program, so only this Windows job can build it.
  pull_request:
    branches: [linux-native]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request replaces its unfinished build; builds of linux-native itself always finish.
concurrency:
  group: linux-package-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Require the text-only Steam export manifest
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'data/steam-export-manifest.json')) {
            throw 'Missing data/steam-export-manifest.json. Generate it from the supported game DLL with the documented local command, commit only the JSON, and push it first.'
          }
      - name: Build package
        shell: pwsh
        run: ./scripts/Package-HellForge.ps1 -SteamExports data/steam-export-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: HellForge-Linux-package
          path: |
            artifacts/package/HellForge-Linux.zip
            artifacts/engine-package/hellforge-engine-*.zip
            artifacts/package/HellForge-Setup.exe
          if-no-files-found: error

  linux-installer:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HellForge-Linux-package
          path: downloaded
      - name: Build click-to-install archive
        run: |
          set -euo pipefail
          mkdir -p installer
          unzip -q downloaded/package/HellForge-Linux.zip -d payload
          cp -a payload/app/launcher-linux/. installer/
          cp downloaded/package/HellForge-Linux.zip installer/
          chmod +x installer/HellForge.Launcher
          mkdir -p artifacts
          tar -czf artifacts/HellForge-Linux-Installer.tar.gz -C installer .
      # The same installer with no archive inside it, for Nexus Mods, which quarantines an archive in an archive: the
      # package as HellForge-Linux/ and its engine package as a folder, which the installer zips back. Modes are kept,
      # so HellForge.Launcher stays executable once the zip is extracted.
      - name: Build the zip without nested archives
        run: |
          set -euo pipefail
          root=unpacked/HellForge-Linux-Installer
          mkdir -p "$root"
          cp -a payload/app/launcher-linux/. "$root/"
          cp -a payload "$root/HellForge-Linux"
          engine="$root/HellForge-Linux/app/engine-package"
          unzip -q "$engine.zip" -d "$engine"
          rm "$engine.zip"
          chmod +x "$root/HellForge.Launcher"
          nested=$(find "$root" -type f \( -iname '*.zip' -o -iname '*.7z' -o -iname '*.rar' -o -iname '*.tar' \
            -o -iname '*.gz' -o -iname '*.tgz' -o -iname '*.xz' -o -iname '*.bz2' -o -iname '*.zst' -o -iname '*.nupkg' \))
          if [ -n "$nested" ]; then
            echo "::error::An archive is left inside the installer zip: $nested"
            exit 1
          fi
          (cd unpacked && zip -q -r -X ../artifacts/HellForge-Linux-Installer.zip HellForge-Linux-Installer)
      - uses: actions/upload-artifact@v4
        with:
          name: HellForge-Linux-Installer
          path: artifacts/HellForge-Linux-Installer.tar.gz
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: HellForge-Linux-Installer-zip
          path: artifacts/HellForge-Linux-Installer.zip
          if-no-files-found: error
